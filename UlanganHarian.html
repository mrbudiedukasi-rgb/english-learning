<!DOCTYPE html>
<html>

<head>
<title>UH Bahasa Inggris</title>
</head>

<body>

<h2>Ulangan Harian</h2>

<input
id="nama"
placeholder="Nama">

<br><br>

<input
id="kelas"
placeholder="Kelas">

<br><br>

<p>
1. What is the synonym of happy?
</p>

<input
type="radio"
name="q1"
value="A">

Sad

<br>

<input
type="radio"
name="q1"
value="B">

Joyful

<br>

<input
type="radio"
name="q1"
value="C">

Angry

<br><br>

<button onclick="submitQuiz()">

Kirim

</button>

<script>

function async function submitQuiz(){

 let nilai=0;

 const jawaban=
 document.querySelector(
 'input[name="q1"]:checked'
 );

 if(
 jawaban &&
 jawaban.value==="B"
 ){
   nilai=100;
 }

 const data = {

   id:"1001",

   nama:
   document
   .getElementById(
   "nama"
   ).value,

   kelas:
   document
   .getElementById(
   "kelas"
   ).value,

   nilai:nilai

 };

 await fetch(
 "https://script.google.com/macros/s/AKfycbwqK4LiFM8FO6-DDMbB2dmqnNr1L8TRRYUk9jyrDcbRXfPRL3Eu5bvKsztDa2uxQzpElw/exec",
 {
   method:"POST",
   body:JSON.stringify(data)
 });

 alert(
 "Nilai berhasil dikirim"
 );

}{

 let nilai=0;

 const jawaban=
 document.querySelector(
 'input[name="q1"]:checked'
 );

 if(
 jawaban &&
 jawaban.value==="B"
 ){
   nilai=100;
 }

 alert(
 "Nilai Anda: "
 + nilai
 );

}

</script>

</body>
</html>
