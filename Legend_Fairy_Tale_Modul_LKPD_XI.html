/* 5 stimuli per meeting, each 120+ words */
[
`Long ago, villagers living near Mount Bromo told a story about a young man named Jaka Seger. He was known as a calm and responsible leader. He married Roro Anteng, a thoughtful woman from another noble family. The couple lived peacefully, but they worried because they had no children. They prayed and promised to respect the mountain and the community if their wish was granted. In time, they had many children. However, the mountain was still part of their daily life, and the family was expected to keep its promise. When a difficult event threatened the community, the youngest child, Kesuma, became part of the old story. People remembered the tale as an explanation of the Tengger community’s relationship with Mount Bromo. Whether every event happened exactly as told is not the main point. The story remains a cultural narrative that connects a place, a community, a tradition, and a lesson about responsibility.`,
`Asha lived with her grandmother in a small house beside a forest. One evening, Asha found a silver key under an old tree. When she touched it, a tiny blue bird appeared and said that the key could open only a door protected by kindness. Asha searched the forest and found a wooden door standing between two rocks. Behind it was a room filled with food, books, and warm blankets. A poor traveler was sleeping there. The bird explained that the room belonged to anyone who was willing to share. Asha could have taken the treasures for herself, but she remembered her grandmother’s advice: “A gift becomes meaningful when it helps another person.” She carried the food to the traveler and left the books for village children. The next morning, the door had disappeared, but a small silver key remained in Asha’s pocket. She understood that the real magic was not the key; it was her choice to help others.`,
`In a coastal village, people told a legend about a fisherman called Arman who discovered a strange stone on the beach. The stone was warm even at night and seemed to glow after rain. Arman brought it home, but his daughter warned him not to keep something that did not belong to him. The next day, the village elder recognized the stone as part of an old shrine destroyed by a storm many years earlier. Arman returned it to the coast with the villagers. Soon after, fishermen repaired the damaged shrine together. The story became a reminder that valuable objects may carry meaning beyond their material price. Younger villagers retell the story differently: some say the stone was magical, while others believe its warmth came from sunlight stored in the rock. Both versions preserve the central idea that community memory can shape a legend.`,
`Mira was a young tailor who dreamed of attending the king’s festival. She owned only a simple blue dress. One night, a fairy appeared and offered to make the dress magnificent, but only until midnight. Mira agreed and entered the palace. She danced, ate delicious food, and spoke politely with many guests. At eleven-thirty, she noticed a servant carrying heavy trays alone. Instead of ignoring him, Mira helped. The fairy’s magic began to fade before midnight, and Mira returned home without waiting for applause. The next morning, the prince visited the village. He had noticed that the mysterious guest was the only person at the festival who had helped the servant without expecting a reward. Mira was invited back to the palace, not because of the beautiful dress, but because of her kindness. The story suggests that appearance can attract attention, while character earns trust.`,
`Near an old Indonesian lake, villagers told a story about a farmer who found a golden fish. The fish asked him not to reveal its secret. The farmer agreed, and soon the fish became a woman who married him. They had a daughter, but one day the farmer became angry because the child made a mistake. He shouted words that broke his promise. Dark clouds gathered, rain flooded the valley, and a great lake appeared. The daughter survived on a hill, while the father disappeared. People later called the place Lake Toba. The story is a legend because it is strongly connected with a real geographical place and a community’s cultural memory, although the supernatural events are part of the traditional narrative. Readers may interpret the story as a warning about controlling anger, keeping promises, and thinking before speaking. Different retellings may change details while preserving the central conflict.`
],
[
`A village boy named Rafi once ignored an old bridge because he thought it was ugly. One rainy afternoon, he saw a child trapped on the other side. The bridge looked dangerous, but Rafi remembered that the village carpenter had recently repaired its ropes. He crossed carefully and brought the child back. Later, villagers discovered that several people had been avoiding the bridge because of its appearance, even though it was safe after the repair. The village leader used the event to teach children to distinguish evidence from assumptions. The orientation introduces Rafi, the village, and the bridge. The complication begins when the child becomes trapped. The resolution occurs when Rafi uses reliable information and acts carefully. A short coda explains the lesson: appearances are not enough for a good decision. The story shows that courage does not mean acting without thought; it means making a responsible choice despite uncertainty.`,
`The old woman in the forest lived alone, but every Friday she left a bowl of rice near her gate. One winter evening, a hungry wolf came to the house. Instead of attacking, the wolf asked for food. The woman invited it to eat outside because she was still cautious. The next week, the wolf returned with firewood. A friendship slowly developed. One day, hunters entered the forest and planned to capture the wolf. The woman warned the wolf, but she did not lie to the hunters. She explained that the wolf had never harmed her and asked them to observe its behavior. The hunters agreed to leave the animal alone. The story’s complication is the threat from the hunters, while the resolution is achieved through honest communication. The coda emphasizes that empathy can grow when people take time to understand another perspective. It also shows that kindness does not require ignoring safety.`,
`In a town famous for its red roofs, a baker named Lila discovered that her bread tasted sweet whenever she told the truth. At first, she thought the change was a joke. Soon, customers noticed it too. Lila became popular, but she began to fear that one honest mistake would ruin her business. One morning, a customer complained that a loaf was burnt. Lila could have blamed the oven, but she admitted that she had been distracted. She offered a replacement. The customer appreciated her honesty and told others about the experience. The magical bread eventually returned to normal. Lila realized that the special taste had never been the most valuable thing. Her reputation had grown because she accepted responsibility. The orientation establishes the bakery and Lila. The complication is her fear of losing customers. The resolution comes when she tells the truth and repairs the situation. The coda presents honesty as a practical value, not merely a magical idea.`,
`A prince named Danu was told that a dragon guarded a mountain path. He wanted to become famous, so he planned to defeat it alone. On the journey, he met a farmer who explained that the dragon was protecting a nest. Danu ignored the warning and continued. When he reached the cave, he saw the dragon beside three eggs. The creature did not attack until Danu raised his sword. He lowered it and apologized. Instead of fighting, he asked whether there was another path to the village. The dragon moved aside. Danu returned and told the people what he had learned. The villagers were surprised because the old stories described the dragon as cruel. The complication is Danu’s ambition and the misunderstanding about the dragon. The resolution comes through reconsideration and communication. The story encourages readers to question assumptions before using force. It also illustrates how perspective can change the meaning of an apparently dangerous character.`,
`A fisherman named Bima found a wooden boat that seemed to repair itself whenever it was damaged. He used it to catch more fish than anyone else. Soon he became wealthy and stopped helping other fishermen. During a storm, the boat carried him far from the shore. He remembered that his neighbors had often helped him repair nets before he became rich. Bima decided to share the boat’s secret when he returned. The magical boat then became an ordinary boat. Some villagers thought the magic had disappeared because Bima had learned the lesson it was meant to teach. Others believed the boat had never been magical. The story’s structure can be divided into an orientation about Bima and the boat, a complication involving greed and the storm, and a resolution involving a change of attitude. The final message is that resources become more valuable when they strengthen a community rather than isolate one person.`
],
[
`Nara was the main character in a story set in a mountain village during a long dry season. She was a curious teenager who wanted to help her family. Her younger brother, Timo, often followed her. The village’s supporting characters included an elderly farmer and a group of neighbors. When the village spring became weak, Nara explored the hills and found a blocked channel. She wanted to clear it immediately, but the farmer warned that the rocks were unstable. Nara listened and organized a group to work safely the next morning. They removed the blockage and restored part of the water flow. The plot develops through a problem, a risky first impulse, advice, cooperation, and a successful action. The story shows that a protagonist does not need to solve everything alone. Nara’s decision changes after she receives information. Her main conflict is partly external—the blocked water channel—and partly internal—her desire to act quickly versus her need to act responsibly.`,
`In a quiet kingdom, Princess Elara loved maps more than jewels. Her supporting character was Tomas, a young messenger who knew every village road. When a bridge collapsed, the kingdom was divided into two areas. Elara wanted to send supplies immediately, but Tomas explained that the usual road was unsafe. Together they studied an old map and found a narrow forest path. The path was difficult, yet it allowed the supplies to reach the affected villagers. The setting changes from the palace to the forest and then to the isolated village. This change increases the tension because the characters must travel through an unfamiliar environment. Elara is the main character because her choices move the plot forward. Tomas supports her by providing knowledge. The conflict is external because the collapsed bridge blocks movement, but it also tests Elara’s ability to lead. The turning point occurs when she accepts Tomas’s advice rather than insisting on her first plan.`,
`A boy named Seno lived near a river that was said to sing at midnight. His grandmother believed the song was a warning, while Seno thought it was only the sound of water against stones. One night, he followed the river and heard a melody. He discovered that the sound came from reeds growing between rocks. Suddenly, heavy rain began upstream. Remembering his grandmother’s warning, Seno ran home and told the villagers. They moved their animals to higher ground before the river rose. The story uses both internal and external conflict. Seno’s internal conflict is his uncertainty about whether to trust a traditional belief. The external conflict is the threat of flooding. The setting of time—midnight—and place—the riverbank—creates suspense. Seno changes from a skeptical boy into someone who respects experience while still looking for evidence. The story suggests that tradition and observation can sometimes work together rather than compete.`,
`A clever fox named Raka lived near a forest market. He often helped a rabbit merchant carry baskets, but he secretly wanted the rabbit’s successful shop. One day, Raka spread a false rumor that the rabbit sold poor-quality fruit. Customers stopped coming. The rabbit investigated and discovered the rumor. Instead of attacking Raka, the rabbit asked him why he had done it. Raka admitted that he was jealous. The rabbit offered him a job managing deliveries. Raka accepted and gradually became trustworthy. The plot contains a clear conflict between the two characters, but the deeper conflict is inside Raka: he wants success but chooses an unfair method. The setting—a forest market—explains why reputation matters. The resolution is not punishment but an opportunity to change. The supporting character, the rabbit, influences Raka’s development by responding calmly. The story encourages readers to examine motives behind harmful actions and to consider restorative solutions.`,
`In a coastal village, an old lighthouse keeper named Wira lived with his granddaughter, Sari. During a violent storm, the lighthouse lamp stopped working. Wira wanted to repair it himself, but Sari noticed that the electrical system was damaged beyond a simple repair. She contacted the harbor workers, while Wira prepared an emergency lantern. The conflict became urgent when a fishing boat was still at sea. The setting of time—a stormy night—and place—a remote lighthouse—creates danger and suspense. The main characters are Sari and Wira because both make decisions that influence the outcome. Supporting characters include the harbor workers and fishermen. The climax occurs when the emergency lantern is placed in the highest window. The fishing boat sees the light and safely changes direction. The resolution shows cooperation between generations. The story demonstrates that experience and new knowledge can complement each other when people communicate respectfully.`
],
[
`A young woman named Hana lived in a village where people valued hospitality. One day, a tired traveler arrived during a festival. Hana shared her family’s meal even though there was not much food left. Her brother complained that the family might go hungry. Hana explained that they could cook another simple meal the next day. The traveler later revealed that he was a community leader from a distant village. He invited the family to a celebration of local cooperation. The story’s moral value is generosity, but readers should also examine the practical side of Hana’s choice. She did not give away everything; she shared what she could and accepted a reasonable consequence. The cultural value of welcoming travelers is central to the narrative. A critical reader might ask whether the family’s economic situation changes the evaluation of the decision. The story therefore supports more than one perspective. It teaches that kindness can be meaningful when it is balanced with responsibility and awareness of others.`,
`Two sisters, Lina and Lani, lived in a magical forest. Lina was patient, while Lani was impulsive. They found a tree that produced one golden fruit each year. An inscription said the fruit should be taken only when the village truly needed it. Lani wanted to sell it and buy expensive clothes. Lina suggested waiting until the village’s crops recovered. Their argument became serious, and Lani secretly took the fruit. Before she could sell it, she saw a farmer crying because his family had no food. Lani returned the fruit and apologized. The sisters gave it to the village. The story invites perspective analysis. From Lani’s perspective, the fruit represented freedom and recognition. From the farmer’s perspective, it represented survival. Lina’s decision was more community-centered, but Lani’s desire for personal reward was also understandable. The moral lesson becomes stronger because the character changes after seeing consequences, not simply because someone tells her what is right.`,
`A legend from a fictional island tells of a chief who built a stone bridge across a dangerous river. The chief ordered everyone to cross quickly because he wanted the bridge completed before a ceremony. A young builder warned that one section was weak, but the chief ignored him. During the ceremony, the bridge cracked. No one was injured because the builder had secretly placed warning signs nearby. The chief admitted his mistake and asked the community to rebuild the bridge together. The story can be compared with narratives about pride and leadership. The chief’s problem is not only that he makes a poor technical decision; he fails to listen to another person’s expertise. The moral value is responsible leadership. A critical reader should also notice that the builder’s secret action prevented harm but did not solve the communication problem. The story therefore encourages leaders to listen and encourages experts to speak clearly when safety is involved.`,
`In a fairy tale called The Glass Mountain, a girl named Noor climbs a magical mountain to find a medicine for her sick mother. Along the way, she meets a giant who blocks the path. Instead of fighting, Noor asks why he guards the mountain. The giant says people have repeatedly taken treasures without permission. Noor promises to take only the medicine and return. He allows her to pass. At the top, Noor finds the medicine beside a mirror. The mirror shows not her appearance but the consequences of her choices. She sees that taking extra treasure would leave other families without medicine. She takes only what she needs. The story presents a moral lesson about restraint and empathy. The giant’s perspective changes the conflict: he is not simply an obstacle but a protector responding to previous harm. Readers can evaluate Noor’s decision using intention, consequences, and alternatives. The story suggests that understanding another perspective can turn a confrontation into cooperation.`,
`A village story tells of two friends, Arif and Bayu, who disagree about a community garden. Arif wants to plant vegetables for families, while Bayu wants to plant flowers for visitors. Both have good intentions, but they argue loudly. An elder asks them to interview residents before deciding. The interviews show that families need vegetables, while children want a beautiful space. The friends combine the ideas by dividing the garden into two areas. Their conflict is resolved through evidence and compromise. The story can be compared with fairy tales where a single hero solves a problem alone. Here, the solution is collective rather than magical. The moral value is respectful disagreement. The characters do not need to abandon their original beliefs completely. Instead, they listen, gather information, and create a better plan. In daily life, a similar method could help students solve disagreements about group projects, classroom rules, or school events.`
],
[
`Once there was a young storyteller named Kiran who wanted to write a fairy tale. She created a hero, a talking deer, a hidden valley, and a difficult choice. At first, her story had many magical events but no clear goal. Her teacher asked her to create a story map. Kiran decided that the hero wanted to save a village from a drought. The talking deer became a guide, and the hidden valley contained a spring. The complication began when the hero had to choose between taking the water alone or sharing it. Kiran wrote the resolution as a community effort. This example shows why planning matters before creative writing. A story can have beautiful images but still feel confusing if the character’s goal and conflict are unclear. A strong story map connects each event through cause and effect. The moral value should emerge naturally from the character’s decision rather than being added as an unrelated sentence at the end.`,
`A student named Malik wanted to rewrite the ending of a classic fairy tale. In the original version, the hero defeated the villain through a magical sword. Malik changed the ending so the hero listened to the villain’s reason for stealing the kingdom’s food. They discovered that the villain’s village had suffered a famine. The hero offered a fair agreement: food would be shared, but the stolen supplies would be returned. The new ending changes the conflict from physical victory to negotiation. To make the alternative ending believable, Malik kept the original setting and characters but changed the hero’s final decision. This is an important creative-writing principle: an alternative ending should grow from existing information. It should not suddenly introduce an unrelated character or magical object merely to solve the problem. Malik’s version also adds moral complexity because the reader can understand the villain without approving the theft.`,
`In a legend-writing task, Sita chooses a real hill near her town as the setting. She invents a fictional explanation for why a large stone stands at the top. According to her story, a village guardian turned into stone after protecting farmers from a terrible storm. Sita includes a family tradition of visiting the hill every year. Her story is clearly fictional, but it connects the imagined event to a recognizable place and community practice. The story map includes orientation, complication, resolution, and coda. The dialogue is short and polite because the characters disagree about whether the guardian should leave the village. Sita’s teacher praises the story because the setting gives it a local identity while the fictional elements make it a creative legend. The task demonstrates that creative writing is not only about imagination; it is also about choosing details that support a coherent world and meaningful conflict.`,
`A fairy-tale writer named Edo created a character called Mira who could speak to stars. Edo first wrote long descriptions of every star, but the story became slow. He revised the draft by using dialogue to reveal Mira’s problem. “If I ask the stars for help, I may never learn to solve the problem myself,” Mira says. Her friend answers, “Then ask for advice, not a solution.” This dialogue moves the plot because Mira decides to climb the hill and investigate the mysterious light herself. The example shows how dialogue can reveal personality, conflict, and decisions at the same time. It also demonstrates respectful disagreement. The friend does not insult Mira; instead, the friend offers another perspective. In a classroom story, students can use dialogue to show rather than explain emotions. A character who says, “I am angry,” is less revealing than a character who uses careful but firm words while refusing an unfair request.`,
`A group of students creates a legend about an old school tree. They decide that the tree was planted by the school’s first principal. In their fictional version, the principal planted it after promising to protect every student’s right to learn. The tree survives storms and becomes a symbol of perseverance. The students map the story with five stages: orientation, complication, turning point, resolution, and coda. Their complication is a plan to cut the tree down because it appears damaged. The students investigate and discover that only a few branches are unsafe. They persuade the school to prune rather than remove the tree. Their coda connects the tree’s survival to responsible decision-making. The story combines creative thinking with evidence-based action. It also models polite dialogue: the students disagree with the plan but present reasons and alternatives rather than attacking the people who proposed it.`
]

 const n=document.getElementById("studentName").value.trim(),c=document.getElementById("studentClass").value,code=document.getElementById("accessCode").value.trim();
 if(code===teacherCode){showTeacher();return}
 if(!n||n!==n.toUpperCase()||!c){document.getElementById("loginMsg").textContent="Lengkapi nama dengan HURUF KAPITAL dan pilih kelas.";return}
 if(access[code]===undefined){document.getElementById("loginMsg").textContent="KODE AKSES SALAH!";return}
 current=access[code];document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");slide=0;answers={};submitted=false;renderMeeting();
}
function renderMeeting(){
 const m=meetings[current];document.getElementById("meetingPill").textContent=`Pertemuan ${current+1} • ${m.selis}`;
 document.getElementById("meetingTitle").textContent=m.title;document.getElementById("meetingTarget").textContent="Target: "+m.target;
 const wrap=document.getElementById("slides");wrap.innerHTML="";
 m.slides.forEach((s,i)=>{const d=document.createElement("div");d.className="card slide"+(i===0?" active":"");d.innerHTML=`<span class="pill">Slide ${i+1}</span><h2>${s[0]}</h2><p>${s[1]}</p>${i===4?`<div class="success">Materi inti selesai. Buka LKPD untuk mengerjakan 30 soal.</div>`:""}<div class="nav"><button class="btn" onclick="changeSlide(-1)">← Sebelumnya</button><button class="btn primary" onclick="changeSlide(1)">${i===4?"Selesai Materi →":"Selanjutnya →"}</button></div>`;wrap.appendChild(d)});
 updateSlide();document.getElementById("unlock").classList.add("hidden");document.getElementById("worksheet").classList.add("hidden");document.getElementById("result").classList.add("hidden");
}
function changeSlide(dir){if(dir>0&&slide===4){document.getElementById("unlock").classList.remove("hidden");document.getElementById("unlock").scrollIntoView({behavior:"smooth"});return}slide=Math.max(0,Math.min(4,slide+dir));updateSlide()}
function updateSlide(){document.querySelectorAll(".slide").forEach((x,i)=>x.classList.toggle("active",i===slide));document.getElementById("slideBar").style.width=((slide+1)/5*100)+"%";document.getElementById("slideCount").textContent=`Slide ${slide+1} dari 5`}
function unlockLKPD(){
 const code=document.getElementById("lcode").value.trim();
 const now=new Date(),dd=String(now.getDate()).padStart(2,"0"),mm=String(now.getMonth()+1).padStart(2,"0"),yy=String(now.getFullYear()).slice(-2),expected=dd+mm+yy+"peace";
 if(code!==expected){document.getElementById("unlockMsg").textContent="Kode akses tidak valid.";return}
 document.getElementById("unlock").classList.add("hidden");renderQuestions();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderQuestions(){
 const qs=questionBanks[current],box=document.getElementById("worksheet");box.classList.remove("hidden");
 let html=`<div class="card"><h2>LKPD — Pertemuan ${current+1}</h2><p><b>${esc(meetings[current].title)}</b></p><p class="small">30 soal • 10 pilihan ganda • 10 pilihan ganda kompleks • 5 true/false • 5 matching</p>`;
 for(let i=0;i<30;i++){
   if(i%5===0)html+=`<div class="stimulus"><b>Stimulus ${i/5+1}</b><p>${esc(stimuli[current][i/5].text)}</p></div>`;
   const q=qs[i],num=i+1;html+=`<div class="q"><h4>${num}. ${esc(q[1])}</h4>`;
   if(q[0]==="mc")["A","B","C","D","E"].forEach((o,j)=>html+=`<label class="option"><input type="radio" name="q${num}" value="${o}"> <b>${o}.</b> ${esc(q[2+j])}</label>`);
   else if(q[0]==="multi")["A","B","C","D","E"].forEach((o,j)=>html+=`<label class="option"><input type="checkbox" name="q${num}" value="${o}"> <b>${o}.</b> ${["Characters","Setting","Plot","Conflict","Scientific data"][j]}</label>`);
   else if(q[0]==="tf"){html+=`<label class="option"><input type="radio" name="q${num}" value="True"> True</label><label class="option"><input type="radio" name="q${num}" value="False"> False</label>`}
   else {const opts=[q[2],q[2],q[2],q[2],q[2]]; /* labels replaced below */ const map=["A","B","C","D","E"]; const desc=matchingOptions(current,i-26);html+=`<select name="q${num}"><option value="">Choose a match</option>${desc.map((x,k)=>`<option value="${map[k]}">${map[k]}. ${esc(x)}</option>`).join("")}</select>`}
   html+=`</div>`;
 }
 html+=`<button class="btn primary" onclick="checkResult()">Cek Hasil</button><div id="submitMsg" class="error"></div></div>`;
 box.innerHTML=html;box.scrollIntoView({behavior:"smooth"});
}
function matchingOptions(mi,idx){
 const arr=questionBanks[mi].slice(25,30).map(q=>q[2]);
 return arr.map((x,i)=>x);
}
function selected(i){
 const q=questionBanks[current][i],name="q"+(i+1);
 if(q[0]==="multi")return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value).sort().join("");
 if(q[0]==="match")return document.querySelector(`select[name="${name}"]`)?.value||"";
 return document.querySelector(`input[name="${name}"]:checked`)?.value||"";
}
function checkResult(){
 const key=`submitted_${document.getElementById("studentName").value}_${current}`;
 if(localStorage.getItem(key)){document.getElementById("submitMsg").textContent="Pengumpulan untuk pertemuan ini sudah pernah dilakukan.";return}
 const qs=questionBanks[current];let correct=[],wrong=[];qs.forEach((q,i)=>{const a=selected(i),k=q[q[0]==="mc"?7:q[0]==="multi"?7:q[0]==="tf"?2:3]; if(a===k)correct.push(i+1);else wrong.push(i+1)});
 const score=Math.round(correct.length/30*100);localStorage.setItem(key,"1");submitted=true;showResult(score,correct,wrong);
 sendToSheet(score,correct,wrong);
}
function levelList(nums){return [...new Set(nums.map(n=>questionBanks[current][n-1][questionBanks[current][n-1][0]==="mc"?8:questionBanks[current][n-1][0]==="multi"?8:questionBanks[current][n-1][0]==="tf"?3:4]))].join(", ")||"—"}
function competencyScores(correct){
 const cats=["Reading","Vocabulary","Grammar","Critical Thinking","Creative Writing","Generic Structure","Character Analysis","Plot Analysis","Moral Value","Setting","Empathy"];
 const out={};cats.forEach(c=>{const ids=questionBanks[current].map((q,i)=>q[questionBanks[current][i][0]==="mc"?9:questionBanks[current][i][0]==="multi"?9:questionBanks[current][i][0]==="tf"?4:5]===c?i+1:null).filter(Boolean);out[c]=ids.length?Math.round(ids.filter(i=>correct.includes(i)).length/ids.length*100):null});return out
}
function catLabel(s){return s>=86?"Excellent":s>=71?"Good":s>=56?"Fair":"Needs Improvement"}
function showResult(score,correct,wrong){
 const pos=levelList(correct),neg=levelList(wrong),box=document.getElementById("result"),cs=competencyScores(correct);
 box.classList.remove("hidden");box.innerHTML=`<div class="card resultbox"><h2>Hasil Evaluasi</h2><div class="grid"><div><b>Nama</b><br>${esc(document.getElementById("studentName").value)}</div><div><b>Kelas</b><br>${esc(document.getElementById("studentClass").value)}</div><div><b>Pertemuan</b><br>${current+1}</div><div><b>Skor</b><br><span class="score">${score}</span></div></div>
 <hr><h3>Analisis Bloom</h3><p><b>Soal Benar:</b> ${correct.join(", ")||"—"}</p><p><b>Menguasai Level:</b> ${pos}</p><p><b>Soal Salah:</b> ${wrong.join(", ")||"—"}</p><p><b>Kurang Menguasai Level:</b> ${neg}</p>
 <h3>Analisis Kompetensi Bahasa Inggris</h3><table><tr><th>Kompetensi</th><th>Persentase</th><th>Kategori</th></tr>${["Reading","Vocabulary","Grammar","Critical Thinking","Creative Writing"].map(c=>`<tr><td>${c} Skill Mastery</td><td>${cs[c]??0}%</td><td>${catLabel(cs[c]??0)}</td></tr>`).join("")}</table>
 <p class="small">Kategori: Excellent (86–100), Good (71–85), Fair (56–70), Needs Improvement (≤55).</p></div>`;box.scrollIntoView({behavior:"smooth"});
}
function sendToSheet(score,correct,wrong){
 const endpoint="https://script.google.com/xxxxxx";
 const data={nama_sheet:"Legend & Fairy Tale",kelas:document.getElementById("studentClass").value,pertemuan_ke:current+1,nama:document.getElementById("studentName").value,skor:score,analisis_positif:`Soal Benar: ${correct.join(", ")} | Menguasai Level: ${levelList(correct)}`,analisis_negatif:`Soal Salah: ${wrong.join(", ")} | Kurang Menguasai Level: ${levelList(wrong)}`};
 if(endpoint.includes("xxxxxx"))return;
 fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).catch(()=>{});
}
function showTeacher(){
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.add("hidden");const t=document.getElementById("teacher");t.classList.remove("hidden");
 let html="<h1>👩‍🏫 Dashboard Guru</h1><p>Rekap kunci jawaban, Bloom, SELIS, dan distribusi kompetensi.</p>";
 meetings.forEach((m,mi)=>{html+=`<div class="card"><h2>Pertemuan ${mi+1}</h2><table><tr><th>No.</th><th>Kunci</th><th>Bloom</th><th>SELIS</th><th>Kompetensi</th></tr>`;
 questionBanks[mi].forEach((q,i)=>{const key=q[q[0]==="mc"?7:q[0]==="multi"?7:q[0]==="tf"?2:3],bl=q[q[0]==="mc"?8:q[0]==="multi"?8:q[0]==="tf"?3:4],se=q[q[0]==="mc"?9:q[0]==="multi"?9:q[0]==="tf"?4:5],co=q[q[0]==="mc"?10:q[0]==="multi"?10:q[0]==="tf"?5:6];html+=`<tr><td>${i+1}</td><td>${esc(key)}</td><td>${bl}</td><td>${se}</td><td>${esc(co)}</td></tr>`});html+="</table>";
 html+="<h3>Distribusi Bloom</h3><p>"+bloomDist.map(b=>`${b}: ${questionBanks[mi].filter(q=>q[q[0]==="mc"?8:q[0]==="multi"?8:q[0]==="tf"?3:4]===b).length} soal`).join(" • ")+"</p>";
 html+="<h3>Distribusi SELIS</h3><p>"+["P1","P2","P3","P4","P5"].map(p=>`${p}: ${questionBanks[mi].filter(q=>q[q[0]==="mc"?9:q[0]==="multi"?9:q[0]==="tf"?4:5].startsWith(p)).length} soal`).join(" • ")+"</p></div>"});
 t.innerHTML=html;
}
</script>
